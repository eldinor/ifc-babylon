<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFC Speed Test</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c1118;
        --panel: #111a25;
        --text: #e4edf8;
        --muted: #9ab0c7;
        --accent: #3ea9ff;
        --border: #2b3b4f;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top, #1c2839 0%, var(--bg) 60%);
        color: var(--text);
      }

      .layout {
        max-width: 1800px;
        margin: 24px auto;
        padding: 0 16px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: end;
      }

      .control {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 180px;
      }

      button {
        height: 40px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #04111d;
        padding: 0 14px;
        cursor: pointer;
        font-weight: 600;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      button:not(:disabled):hover {
        filter: brightness(1.05);
      }

      input[type="number"],
      input[type="file"] {
        font: inherit;
        color: var(--text);
        background: #0a131d;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
      }

      pre {
        margin-top: 16px;
        background: #0a131d;
        color: #cfe0f5;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        min-height: 240px;
        overflow-x: auto;
        overflow-y: auto;
        white-space: pre;
      }

      .hint {
        margin: 0 0 12px 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="panel">
        <h2>IFC Speed Test</h2>
        <p class="hint">Benchmarks merge modes: by-express-color, by-color, and two-material (worker path).</p>
        <div class="controls">
          <div class="control">
            <label for="iterations">Iterations</label>
            <input id="iterations" type="number" min="1" max="10" value="3" />
          </div>
          <div class="control">
            <label for="ifc-file">IFC file (optional)</label>
            <input id="ifc-file" type="file" accept=".ifc" />
          </div>
          <button id="run-btn">Run Benchmark</button>
        </div>
        <pre id="output"></pre>
      </div>
    </div>
    <script type="module" src="/test-speed/main.ts"></script>
  </body>
</html>
